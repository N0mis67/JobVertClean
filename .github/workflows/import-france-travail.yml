name: Import France Travail jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"

jobs:
  import-france-travail:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke test JobVert import API with Node
        run: |
          node - <<'NODE'
          const apiUrl = process.env.JOBVERT_IMPORT_API_URL;
          const apiSecret = process.env.JOBVERT_IMPORT_API_SECRET;

          const payload = {
            source: "FRANCE_TRAVAIL",
            dryRun: true,
            jobs: [
              {
                externalId: `github-actions-node-smoke-test-${Date.now()}`,
                title: "Smoke test GitHub Actions Node",
                location: "Strasbourg",
                employmentType: "CDI",
                description: "Test minimal depuis GitHub Actions avec Node fetch vers l'API JobVert.",
                score: 85,
                scoreReasons: ["Smoke test GitHub Actions Node"]
              }
            ]
          };

          const body = JSON.stringify(payload);

          console.log(`Payload size: ${Buffer.byteLength(body, "utf8")} bytes`);
          console.log(`Calling JobVert API: ${apiUrl}`);

          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiSecret}`,
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "JobVertImporter/1.0 (+https://jobvert.fr)"
            },
            body
          });

          const text = await response.text();

          console.log(`${response.status} ${response.statusText}`);
          console.log(text);

          if (!response.ok) {
            process.exit(1);
          }
          NODE
        env:
          JOBVERT_IMPORT_API_URL: ${{ secrets.JOBVERT_IMPORT_API_URL }}
          JOBVERT_IMPORT_API_SECRET: ${{ secrets.JOBVERT_IMPORT_API_SECRET }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run France Travail importer
        run: python scripts/import-france-travail-to-jobvert.py
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          JOBVERT_IMPORT_API_URL: ${{ secrets.JOBVERT_IMPORT_API_URL }}
          JOBVERT_IMPORT_API_SECRET: ${{ secrets.JOBVERT_IMPORT_API_SECRET }}
          DRY_RUN: "false"
          DAYS_BACK: "2"
          MIN_SCORE: "70"
          MAX_JOBS_TO_SEND: "5"
          BATCH_SIZE: "5"